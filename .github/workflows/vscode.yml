name: vscode

on:
  push:
    branches: [main]
    # Both tag spellings: `0.1.1` is the semver, `v0.1.1` the usual git convention.
    tags: ["[0-9]*", "v[0-9]*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # Trusted publishing: `vsce publish --oidc` exchanges this token for a Marketplace credential.
  id-token: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      # Upstream pins this in its package.json; the extracted tree expects the same one.
      BUN_VERSION: 1.4.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the VSIX
        run: bun script/build.ts

      - name: Typecheck
        working-directory: .build/work/packages/vscode
        run: bun run typecheck
      - name: Test
        working-directory: .build/work/packages/vscode
        run: bun run test

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-vscode
          path: opencode-vscode-*.vsix
          if-no-files-found: error

      # Publishing is tag-only: `git tag 0.1.1 && git push --tags` (`v0.1.1` works too).
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        # Trusted publishing: the publisher trusts this workflow, and the job proves its identity with
        # the workflow's OIDC token. No PAT. See `permissions: id-token: write` above.
        run: |
          log=$(mktemp)
          set +e
          bun x @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath opencode-vscode-*.vsix >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            # The step log needs a token to read; annotations are public, so surface the reason there.
            reason=$(tail -c 900 "$log" | tr '\n' ' ' | tr -d '%')
            echo "::error title=Marketplace publish failed::$reason"
            exit "$status"
          fi

      - name: Attach the VSIX to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 &&
            gh release upload "$GITHUB_REF_NAME" opencode-vscode-*.vsix --clobber ||
            gh release create "$GITHUB_REF_NAME" opencode-vscode-*.vsix --generate-notes --verify-tag
