<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>OpenCode</title>
    <meta name="theme-color" content="#fafafa" />
    <script>
      // The GUI waits for the extension handshake before it paints: show the editor background
      // meanwhile, so the sidebar never flashes the browser's white.
      ;(() => {
        const background = new URLSearchParams(location.search).get("background")
        if (!background) return
        const style = document.createElement("style")
        style.textContent = `html, body { background: ${background} }`
        document.head.append(style)
      })()
    </script>
  </head>
  <body
    class="antialiased overscroll-none font-(family-name:--font-family-text) text-[13px] font-[440] overflow-hidden bg-v2-background-bg-deep"
  >
    <noscript>You need JavaScript to run the OpenCode GUI.</noscript>
    <div id="root" class="flex flex-col h-dvh bg-v2-background-bg-deep p-px"></div>
    <script src="/src/host/entry.tsx" type="module"></script>
  </body>
</html>
